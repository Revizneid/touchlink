name: CI — test, lint, and security

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on windows-latest
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install desktop dependencies
        run: python -m pip install --upgrade pip && pip install -r desktop/requirements.txt

      - name: Install test and security tooling
        run: >
          pip install pytest pytest-asyncio pytest-aiohttp
          ruff mypy bandit pip-audit

      - name: Lint with Ruff
        run: ruff check desktop tests --output-format=github

      - name: Type-check with mypy
        run: mypy desktop --ignore-missing-imports --no-error-summary

      - name: Security scan with Bandit
        run: bandit -r desktop relay -q

      - name: Dependency audit
        run: pip-audit -r desktop/requirements.txt --format human

      - name: Run pytest
        run: pytest tests/ -q --tb=short
        env:
          PYTHONIOENCODING: utf-8
