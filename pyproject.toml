[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "touchlink"
version = "3.0.0"
description = "Secure desktop-to-mobile remote control platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TouchLink" }]
dependencies = [
    "aiohttp>=3.9",
    "mss>=9.0",
    "Pillow>=10.0",
    "pyperclip>=1.8",
    "qrcode[pil]>=7.4",
    "cryptography>=42.0",
    "numpy>=1.24",
    "pywin32>=306; platform_system == 'Windows'",
    "dxcam==0.3.0; platform_system == 'Windows'",
]

[project.scripts]
touchlink = "desktop.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build"]
